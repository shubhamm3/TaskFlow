version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7
    container_name: taskflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Express + Node.js Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - JWT_SECRET=taskflow_docker_compose_super_secret_jwt_2026
      - JWT_EXPIRE=30d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskflow-network

  # React Frontend Service (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskflow-network

volumes:
  mongo-data:
    driver: local

networks:
  taskflow-network:
    driver: bridge

